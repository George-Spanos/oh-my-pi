modelRoles:
  task: fireworks/deepseek-v4.1-flash
  plan: fireworks/deepseek-v4.1-flash:max
  slow: fireworks/glm-5.3:high
  web: web/brave
  default: fireworks/deepseek-v4.1-flash:high
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: titanium
setupVersion: 2
startup:
  checkUpdate: false
retry:
  fallbackChains:
    # Brave is the only web provider. A present-but-empty array disables the
    # built-in priority chain; deleting the key would restore it.
    web: []
providers:
  fireworksTier: standard
task:
  agentModelOverrides:
    security-reviewer: "@slow"
    sonic: fireworks/deepseek-v4.1-flash
    task: fireworks/deepseek-v4.1-flash
hideThinkingBlock: true
memory:
  backend: mnemopi